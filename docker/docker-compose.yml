version: '3.8'

services:
  android-builder:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../frontend:/workspace/frontend
      - ../generated:/workspace/generated
      - android-npm-cache:/root/.npm
      - android-gradle-cache:/root/.gradle
      - android-sdk:/opt/android-sdk
    environment:
      - APP_NAME=${APP_NAME:-Shelfio}
      - APP_ID=${APP_ID:-com.shelfio.app}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://gestion-de-books.onrender.com}

volumes:
  android-npm-cache:
  android-gradle-cache:
  android-sdk:

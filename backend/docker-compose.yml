services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bibliotheque-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # La base SQLite est stockée dans le volume "db-data"
      DATABASE_URL: file:/app/data/prod.db
      # ⚠️  Remplacez ces valeurs par de vraies clés secrètes en production
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_min_32_chars_!!}
      REFRESH_SECRET: ${REFRESH_SECRET:-changeme_refresh_secret_min_32_chars_!!}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3001}
    volumes:
      # Volume nommé pour persister la base SQLite entre les redémarrages
      - db-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/livres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  db-data:
    name: bibliotheque-db

#
# .github/workflows/build-android.yml
#
# Pipeline de build Android déclenché par git push
#

name: Build Android APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

#
# Déclencheurs
#
on:
  push:
    branches:
      - main
      - develop
      - prince
  pull_request:
    branches:
      - main
  # Permet de lancer le workflow manuellement depuis l'interface GitHub
  workflow_dispatch:

#
# Jobs
#
jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      #
      # 1. Récupérer le code source
      #
      - name: Checkout du code
        uses: actions/checkout@v4

      #
      # 2. Configurer Node.js 20
      #
      - name: Configuration Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      #
      # 3. Configurer Java 17 (requis par Gradle)
      #
      - name: Configuration Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      #
      # 4. Installer les composants Android SDK manquants
      #    (ubuntu-latest a déjà ANDROID_SDK_ROOT, sdkmanager n'est pas dans PATH)
      #
      - name: Configuration Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      #
      # 5. Cache Gradle (builds plus rapides)
      #
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      #
      # 6. Installer les dépendances Node.js
      #
      - name: Installation des dépendances npm
        working-directory: frontend
        run: npm ci

      #
      # 7. Build Next.js en mode export statique (Capacitor)
      #
      - name: Build Next.js (export statique)
        working-directory: frontend
        run: |
          export BUILD_TARGET=capacitor
          export NEXT_BUILD_TARGET=capacitor
          export NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL || 'https://gestion-de-books.onrender.com' }}"
          echo "▶ BUILD_TARGET=$BUILD_TARGET"
          npm run build

      #
      # 8. Vérifier que le dossier out/ a bien été généré
      #
      - name: Vérification export statique
        run: |
          if [ ! -d "frontend/out" ]; then
            echo "❌ Le dossier frontend/out/ est absent. Vérifiez next.config.ts (output: 'export' quand BUILD_TARGET=capacitor)"
            exit 1
          fi
          echo "✅ frontend/out/ présent ($(ls frontend/out | wc -l) fichiers)"

      #
      # 9. Ajouter et synchroniser la plateforme Android
      #
      - name: Initialisation Capacitor Android
        working-directory: frontend
        env:
          APP_NAME: ${{ vars.APP_NAME || 'Shelfio' }}
          APP_ID: ${{ vars.APP_ID || 'com.shelfio.app' }}
        run: |
          if [ ! -d "android" ]; then
            ./node_modules/.bin/cap add android
          fi
          ./node_modules/.bin/cap sync android

      #
      # 10. Rendre Gradle exécutable
      #
      - name: Permissions Gradle
        working-directory: frontend/android
        run: chmod +x gradlew

      #
      # 11. Compiler l'APK Debug
      #
      - name: Compilation APK Debug
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g"

      #
      # 12. Uploader l'APK comme artefact téléchargeable
      #
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      #
      # 13. Résumé du build
      #
      - name: Résumé du build
        if: success()
        run: |
          APK_PATH="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "## ✅ Build Android réussi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Information | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Fichier | app-debug.apk |" >> $GITHUB_STEP_SUMMARY
          echo "| Taille | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branche | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY

      #
      # 14. Notification d'échec
      #
      - name: Notification d'échec
        if: failure()
        run: |
          echo "## ❌ Build Android échoué" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Consultez les logs ci-dessus pour identifier l'erreur." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Causes fréquentes :**" >> $GITHUB_STEP_SUMMARY
          echo "- \`next.config.ts\` : \`output: 'export'\` non actif quand \`BUILD_TARGET=capacitor\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`capacitor.config.ts\` absent ou \`webDir\` incorrect" >> $GITHUB_STEP_SUMMARY
          echo "- Erreur de compilation dans le code Next.js" >> $GITHUB_STEP_SUMMARY
          echo "- Android SDK non trouvé" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────
  #  JOB iOS — macOS + Xcode (tourne en parallèle avec Android)
  # ─────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS (Xcode / Simulateur)
    runs-on: macos-latest

    steps:
      #
      # 1. Checkout
      #
      - name: Checkout du code
        uses: actions/checkout@v4

      #
      # 2. Node.js 20
      #
      - name: Configuration Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      #
      # 3. Dépendances npm
      #
      - name: Installation des dépendances npm
        working-directory: frontend
        run: npm ci

      #
      # 4. Build Next.js export statique
      #
      - name: Build Next.js (export statique)
        working-directory: frontend
        run: |
          export BUILD_TARGET=capacitor
          export NEXT_BUILD_TARGET=capacitor
          export NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL || 'https://gestion-de-books.onrender.com' }}"
          npm run build

      #
      # 5. Capacitor — add ios + sync
      #
      - name: Initialisation Capacitor iOS
        working-directory: frontend
        env:
          APP_NAME: ${{ vars.APP_NAME || 'Shelfio' }}
          APP_ID: ${{ vars.APP_ID || 'com.shelfio.app' }}
        run: |
          if [ ! -d "ios" ]; then
            ./node_modules/.bin/cap add ios
          fi
          ./node_modules/.bin/cap sync ios

      #
      # 6. CocoaPods (requis par Capacitor iOS)
      #
      - name: Installation CocoaPods
        working-directory: frontend/ios/App
        run: pod install --repo-update

      #
      # 7. Cache CocoaPods pour les prochains builds
      #
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: frontend/ios/App/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('frontend/ios/App/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      #
      # 8. Build pour simulateur iOS (sans signature)
      #
      - name: Build iOS Simulateur (sans signature)
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath $RUNNER_TEMP/ios-build \
            CODE_SIGNING_ALLOWED=NO \
            VALID_ARCHS=x86_64 \
            build | xcpretty || true

      #
      # 9. Zipper le projet iOS source (pour l'ouvrir dans Xcode)
      #
      - name: Préparer artefact source iOS
        run: |
          cd frontend
          zip -r $RUNNER_TEMP/ios-source.zip ios/ --exclude "ios/App/Pods/*"

      #
      # 10. Upload .app simulateur
      #
      - name: Upload .app (simulateur)
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/ios-build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 30

      #
      # 11. Upload projet source iOS (à ouvrir dans Xcode)
      #
      - name: Upload projet source iOS (Xcode)
        uses: actions/upload-artifact@v4
        with:
          name: ios-source-xcode-${{ github.sha }}
          path: ${{ runner.temp }}/ios-source.zip
          retention-days: 30

      #
      # 12. Résumé
      #
      - name: Résumé du build iOS
        if: success()
        run: |
          echo "## ✅ Build iOS réussi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artefact | Usage |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`ios-simulator-*\` | Glisser le .app dans un simulateur iOS |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ios-source-xcode-*\` | Dézipper → ouvrir \`App.xcworkspace\` dans Xcode |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notification d'échec iOS
        if: failure()
        run: |
          echo "## ❌ Build iOS échoué" >> $GITHUB_STEP_SUMMARY
          echo "Causes fréquentes : CocoaPods introuvable, Xcode version incompatible, capacitor.config.ts mal configuré" >> $GITHUB_STEP_SUMMARY

